services:
  - type: web
    name: janitorai-nvidia-nim-proxy
    runtime: node

    buildCommand: npm ci
    startCommand: npm start

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: NVIDIA_API_KEY
        sync: false

      - key: ALLOW_UNKNOWN_MODELS
        value: "true"

      - key: NODE_VERSION
        value: "22"
